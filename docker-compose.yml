services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_ed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://atlas:atlas@db:5432/atlas_ed
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-production-abcdef1234567890}
      JWT_EXPIRY_MINUTES: "15"
      RUST_LOG: atlas_backend=debug,tower_http=debug
      CORS_ORIGIN: http://localhost:5173
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
